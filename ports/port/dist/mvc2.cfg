# mvc2.cfg: one "key = value" a line; # starts a note. The game also keeps its own settings here.
#
# The game's data, relative to this folder or a full path:
# arcade = roms/mvsc2
# dc = disc
#
# Which to start when both are found: arcade or dc
# mode = arcade
#
# The picture: exact, fast, half, fast+half, nofog or nosort
# render = exact
#
# Scaling: aspect, integer or stretch. Full screen: yes or no
# scale = aspect
# fullscreen = no
#
# soft or gpu
# renderer = soft
#
# Every character, colour and stage; saves keep only what you really unlocked
# unlock = all
