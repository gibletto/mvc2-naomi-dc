# mvc2.cfg: one "key = value" a line; # starts a note. The game also keeps its own settings here.
#
# The game's data, relative to this folder or a full path:
# arcade = roms/mvsc2
# dc = disc
#
# Which to start when both are found: arcade or dc
# mode = arcade
#
# Scaling: aspect, integer or stretch (aspect, but integer for texel sprites full screen on a 4K screen). Full
# screen: off, desktop (the whole screen at the desktop's mode) or exclusive (a display mode of its own: the
# desktop's size at 240 or 120 Hz where the display has them, else 60; refresh = 60 asks for 60 Hz).
# fullscreen_kind: the one Alt+Enter goes to from a window (the last chosen)
# scale = aspect
# fullscreen = off
# fullscreen_kind = desktop
# refresh = auto
#
# The game's frames a second, the sound kept in time with them: dc (59.94, the default), arcade (59.79, the arcade
# board at 31 kHz), arcade15 (58.90, at 15 kHz) or a number from 57 to 61
# rate = dc
#
# Variable refresh (G-Sync, FreeSync): the display follows the game's rate, each frame shown as it comes. PC: in
# exclusive full screen; without it, each frame is held to a whole number of refreshes (60.02 Hz at 240 Hz, at the
# default rate only); auto (NVIDIA's driver says), on, or off for a display without. MiSTer: on for a FreeSync TV
# on HDMI (the game then paces itself, vsync off); auto and off: the TV's refresh at the game's rate
# vrr = auto
#
# vsync: auto (PC: off only where it would hold the game back), on or off. MiSTer: off paces the game by its own
# clock instead of the TV's refreshes
# vsync = auto
#
# What draws the picture: gpu (the graphics card; OpenGL where it has neither Vulkan nor Direct3D 12), gl (OpenGL)
# or soft (the CPU, at 640 by 480)
# renderer = gpu
#
# soft's picture: exact, fast, lite, lite+fast, half, fast+half, nofog or nosort
# render = exact
#
# The GPU's (and GL's, but for aa, sprites and hud): drawn at auto (the window's size) or 1 to 12 times 640 by 480
# (4.2 say); aa 1 to 4 draws auto that many times larger again, filtered down. Sprites: sharp, smooth, pixel (the nearest texel) or arcade, each
# from the arcade's 640 by 480; or texel, the characters' own pixels evenly sized (with scale = integer, shown
# pixel for pixel: 2688 by 2016, 7 by 9 to a character's pixel, where it fits). texel_grid: shared, every sprite
# on one grid as the arcade's art was drawn, so a character's parts meet, or object, each on its own pixels
# resolution = auto
# aa = 1
# sprites = sharp
# texel_grid = shared
# hud = arcade
#
# Every character, colour and stage; saves keep only what you really unlocked
# unlock = all
#
# Windows: a console beside the game with what it reports, yes or no (started from a terminal, it writes there)
# console = no
